
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flower</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="heartScreen">
            <h1>TAP TO OPEN BABY</h1>
            <button id="heartButton" aria-label="Open flower">💜</button>
        </div>

        <div id="flowerScreen" class="hidden">
            <div class="flower">
                <div class="petals">
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="center"></div>
                </div>
                <div class="stem"></div>
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
            </div>

            <h2>A flower for you baby hehehe 🌷</h2>
            <p>May your day be as beautiful as this flower!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
